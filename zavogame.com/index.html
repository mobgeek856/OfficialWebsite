<script>
document.addEventListener('DOMContentLoaded', function(){
  // 全屏动态网格背景
  if(window.VANTA && window.VANTA.NET){
    window.VANTA.NET({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xffd700,
      backgroundColor: 0x161a24,
      points: 12.00,
      maxDistance: 22.00,
      spacing: 18.00
    });
  }
  // header 动效，延迟确保渲染
  setTimeout(function() {
    if(window.VANTA && window.VANTA.DOTS){
      window.VANTA.DOTS({
        el: "#vanta-header-bg",
        mouseControls: false,
        touchControls: false,
        minHeight: 80.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        backgroundColor: 0x1a1f33,
        color: 0xffffff,
        size: 1.7,
        spacing: 22.00
      });
    }
  }, 200);
});
</script>


<button id="back-to-top" aria-label="Back to top" title="Back to Top">&#8679;</button>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var backBtn = document.getElementById('back-to-top');
  window.addEventListener('scroll', function() {
    if (window.scrollY > 360) {
      backBtn.classList.add('show');
    } else {
      backBtn.classList.remove('show');
    }
  });
  backBtn.onclick = function() {
    window.scrollTo({top:0, behavior:'smooth'});
  };
});
</script>
